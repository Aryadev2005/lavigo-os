# pnpm only runs dependency build scripts that are listed here.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
# Packages pinned at versions published inside pnpm's minimum-release-age window.
minimumReleaseAgeExclude:
  - "@types/react@19.3.3"
  - lucide-react@1.81.0
  - "@aws-sdk/client-s3@3.1178.0"
  - "@aws-sdk/s3-request-presigner@3.1178.0"
  - "@react-pdf/font@4.2.0"
  - "@react-pdf/layout@5.2.2"
  - "@react-pdf/render@4.7.2"
  - "@react-pdf/renderer@4.9.2"
  - "@react-pdf/stylesheet@6.3.4"
  - "@react-pdf/textkit@7.1.0"
  - "@react-pdf/types@2.15.0"
