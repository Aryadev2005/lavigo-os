# pnpm only runs dependency build scripts that are listed here.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
# Packages pinned at versions published inside pnpm's minimum-release-age window.
minimumReleaseAgeExclude:
  - "@types/react@19.3.3"
  - lucide-react@1.81.0
