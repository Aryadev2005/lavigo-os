# Production stack (design §12, §14). One VPS, everything behind Caddy:
#
#   internet ──► caddy :80/:443 ──► web :3000 (Next standalone)        worker (same image)
#                                       │                                   │
#                                       └──── postgres 16 · redis 7 ────────┘
#   migrate (one-shot: prisma migrate deploy) runs first; web and worker wait for it to finish.
#   backup  (daily pg_dump → S3-compatible storage, keeps 14 days).
#
# Only Caddy publishes ports. The web container is NEVER exposed directly: the login rate limit
# trusts the last X-Forwarded-For hop, which only Caddy sets (it overwrites anything the client sent).
# Object storage is managed S3-compatible storage via S3_* (AWS S3 ap-south-1, Cloudflare R2 or
# DigitalOcean Spaces); no MinIO in production.
#
#   cp .env.prod.example .env.prod   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm web pnpm seed:prod
name: lavigo

x-app: &app
  image: ${LAVIGO_IMAGE:-ghcr.io/aryadev2005/lavigo-os:latest}
  restart: unless-stopped
  env_file:
    - path: ${ENV_FILE:-.env.prod}
      required: true
  environment: &app-env
    NODE_ENV: production
    TZ: Asia/Kolkata
    COMPOSE_PROJECT_NAME: lavigo
    APP_URL: ${APP_URL:?set APP_URL, e.g. https://os.lavigo.in}
    AUTH_URL: ${APP_URL}
    AUTH_TRUST_HOST: "true"
    DATABASE_URL: postgresql://lavigo:${POSTGRES_PASSWORD:?}@postgres:5432/lavigo
    REDIS_URL: redis://redis:6379
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2.11.6
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to your domain, e.g. os.lavigo.in}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (Let's Encrypt account email)}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  web:
    <<: *app
    # No `ports:` on purpose (see header).
    expose: ["3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker.ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    <<: *app
    restart: "no"
    command: ["prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lavigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: lavigo
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavigo -d lavigo"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  backup:
    build: ./docker/backup
    image: lavigo-backup:local
    restart: unless-stopped
    env_file:
      - path: ${ENV_FILE:-.env.prod}
        required: true
    environment:
      PGHOST: postgres
      PGUSER: lavigo
      PGDATABASE: lavigo
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_KEEP_DAYS: "14"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
