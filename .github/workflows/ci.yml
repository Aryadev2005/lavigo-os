# docs/03-system-design.md §13. No secrets needed: every provider is faked, v1 has no LLM calls.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: Asia/Kolkata
  DATABASE_URL: postgresql://lavigo:lavigo@localhost:5432/lavigo
  SHADOW_URL: postgresql://lavigo:lavigo@localhost:5432/lavigo_shadow
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma validate
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Dependency audit (non-blocking for now)
        run: pnpm audit --prod
        continue-on-error: true

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lavigo
          POSTGRES_PASSWORD: lavigo
          POSTGRES_DB: lavigo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lavigo -d lavigo"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - name: Migration drift check
        run: |
          echo 'CREATE DATABASE lavigo_shadow;' | pnpm prisma db execute --stdin --url "$DATABASE_URL"
          pnpm prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_URL" \
            --exit-code
      # Tests never use $DATABASE_URL itself: vitest rewrites it to lavigo_test, which
      # tests/global-setup.ts drops, recreates and migrates; tests/setup-guard.ts refuses any other DB.
      - run: pnpm test
      - name: Tests left the main database alone
        run: |
          n=$(psql "$DATABASE_URL" -Atc 'select count(*) from "User"')
          echo "users in $DATABASE_URL after tests: $n"
          test "$n" = "0"

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name (GHCR needs lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lavigo-os" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Stub: the Playwright smoke spec (tests/e2e/smoke.spec.ts) arrives with the Sandbox demo path.
      # Planned: compose up the built image with fakes → seed → `playwright test --trace off`.
      - run: echo "e2e smoke not implemented yet (phase 0 stub)"
