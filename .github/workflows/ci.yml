# docs/03-system-design.md §13. No secrets needed: every provider is faked, v1 has no LLM calls.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: Asia/Kolkata
  DATABASE_URL: postgresql://lavigo:lavigo@localhost:5432/lavigo
  SHADOW_URL: postgresql://lavigo:lavigo@localhost:5432/lavigo_shadow
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma validate
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Every server action / route handler checks auth and role; no LLM dependency
        run: pnpm check:actions
      - name: Dependency audit (fails on high/critical in production deps)
        run: pnpm audit --prod --audit-level high

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lavigo
          POSTGRES_PASSWORD: lavigo
          POSTGRES_DB: lavigo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lavigo -d lavigo"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - name: Migration drift check
        run: |
          echo 'CREATE DATABASE lavigo_shadow;' | pnpm prisma db execute --stdin --url "$DATABASE_URL"
          pnpm prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_URL" \
            --exit-code
      # Tests never use $DATABASE_URL itself: vitest rewrites it to lavigo_test, which
      # tests/global-setup.ts drops, recreates and migrates; tests/setup-guard.ts refuses any other DB.
      - run: pnpm test
      - name: Tests left the main database alone
        run: |
          n=$(psql "$DATABASE_URL" -Atc 'select count(*) from "User"')
          echo "users in $DATABASE_URL after tests: $n"
          test "$n" = "0"

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name (GHCR needs lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lavigo-os" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Smoke (SRS §8): the production image + docker-compose.prod.yml behind Caddy, every provider faked
  # via the explicit DEMO_FAKES flag (docker-compose.prod.local.yml). Runs on PRs too.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENV_FILE: .env.prod.local
      LAVIGO_IMAGE: lavigo-os:local
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image (layers from the build job's cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: lavigo-os:local
          cache-from: type=gha
      - name: Start the prod stack locally (caddy :8080 → web + worker, postgres, redis, migrate)
        run: |
          sh scripts/prod-local-env.sh
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.local.yml --env-file .env.prod.local up -d --wait
      - name: Seed (seed:prod with SEED_DEMO on the empty database)
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod.local.yml --env-file .env.prod.local run --rm -T -e SEED_DEMO=true web pnpm seed:prod
      - name: Health through Caddy
        run: curl -fsS http://localhost:8080/api/health
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke
        run: |
          set -a; . ./.env.prod.local; set +a
          E2E_STAFF_PASSWORD="$SEED_STAFF_PASSWORD" E2E_OWNER_PASSWORD="$SEED_OWNER_PASSWORD" pnpm e2e
      - name: Web and worker refuse to boot without keys when DEMO_FAKES is unset
        run: |
          for s in web worker; do
            if docker compose -f docker-compose.prod.yml -f docker-compose.prod.local.yml --env-file .env.prod.local \
                 run --rm -T --no-deps -e DEMO_FAKES=false "$s" > "refuse-$s.log" 2>&1; then
              echo "$s booted without keys"; exit 1
            fi
            grep -q "Refusing to boot in production" "refuse-$s.log" || { cat "refuse-$s.log"; exit 1; }
            echo "$s refused ✓"
          done
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod.local.yml --env-file .env.prod.local logs --tail=300
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
