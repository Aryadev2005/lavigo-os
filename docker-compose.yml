# Dev stack. Nothing but Docker is needed on the host.
#   make up && make migrate && make seed  →  http://localhost:3000
# Values here are dev defaults; put overrides in .env (git-ignored).

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  image: lavigo-os-dev:latest
  env_file:
    - path: .env
      required: false
  environment: &app-env
    NODE_ENV: development
    TZ: Asia/Kolkata
    APP_URL: ${APP_URL:-http://localhost:3000}
    DATABASE_URL: ${DATABASE_URL:-postgresql://lavigo:lavigo@postgres:5432/lavigo}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    AUTH_TRUST_HOST: "true"
    AUTH_URL: ${APP_URL:-http://localhost:3000}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_REGION: ${S3_REGION:-ap-south-1}
    S3_BUCKET: ${S3_BUCKET:-lavigo}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
    SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
    WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - next_cache:/app/.next
    - pnpm_store:/pnpm/store
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: ["pnpm", "dev"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  worker:
    <<: *app
    command: ["pnpm", "worker:dev"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker.ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lavigo
      POSTGRES_PASSWORD: lavigo
      POSTGRES_DB: lavigo
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavigo -d lavigo"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO stopped publishing official images in 2025; pgsty/minio is a maintained
    # community build of the same server (and ships mc).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio12345}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbuckets:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_USER}" "$${MINIO_PASS}" &&
        mc mb --ignore-existing local/$${BUCKET} &&
        mc anonymous set none local/$${BUCKET} &&
        echo "bucket $${BUCKET} ready (private)"
    environment:
      MINIO_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_PASS: ${S3_SECRET_KEY:-minio12345}
      BUCKET: ${S3_BUCKET:-lavigo}
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
  node_modules:
  next_cache:
  pnpm_store:
